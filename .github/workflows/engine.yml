# Zone 1 (True Engine) continuous integration — M1.1-T1 SKELETON.
#
# Scope is deliberately narrow: compile, vet, and run the unit tests, on a pinned toolchain.
# This is the floor every later gate builds on, and it must be RELIABLY GREEN — a pipeline
# that is red for reasons unrelated to the change under review teaches people to ignore it,
# which is worse than having no pipeline.
#
# The file-size guard (M0-T2) stays in its own workflow: it scans the tracked tree on a
# different trigger scope and has nothing to do with the Go toolchain.
#
# Redis is deliberately NOT provisioned: every test uses miniredis in-process, so a Redis
# service container would be unused infrastructure standing in for a guarantee nothing checks.
name: Engine CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant. Cancelling it frees runners
# and stops a stale red/green result from landing after a newer one.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, vet, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than repeating it here. A hardcoded version
          # silently drifts from the module's own requirement, and then CI is validating a
          # toolchain nobody actually builds with.
          go-version-file: go.mod
          # Cache the module and build caches, keyed on go.sum.
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        # Confirms the downloaded dependencies match go.sum — a cheap integrity check that
        # catches a tampered or corrupted module cache before anything is compiled.
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # -count=1 disables test-result caching. setup-go restores Go's build cache between
        # runs, and that cache can hold PASSING TEST RESULTS: without this flag a run can
        # report green from a previous commit's cached results rather than actually executing
        # the tests. For a money engine, a falsely-green CI run is the worst possible outcome.
        #
        # The integration-tagged tests are excluded here by default (they carry
        # `//go:build integration` and need a real Postgres); they get their own job in T6.
        run: go test -count=1 ./...

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # `golangci-lint run` does NOT validate its own configuration: an unrecognised key
      # is ignored in silence and the run still reports "0 issues". That is how a lint
      # rule can appear to be enforced while doing nothing — the same class of defect
      # Milestone 0 kept finding. `config verify` fails the build on an invalid file.
      #
      # This is not hypothetical: the build-tags setting below was first written under a
      # `build:` key that does not exist. The linter accepted it, reported clean, and
      # analysed none of the integration files.
      - name: Verify the golangci-lint configuration is valid
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: config verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned. An unpinned linter turns an upstream release into a surprise red build
          # on a change that touched nothing — the fastest way to teach a team to ignore CI.
          # Bump it deliberately, as its own reviewed change.
          version: v2.5.0
          args: --timeout=10m

      - name: staticcheck
        # Run standalone as well as through golangci-lint. The two are not redundant: the
        # bundled copy tracks golangci-lint's release cadence and can lag upstream, and the
        # standalone tool applies check families the bundled linter does not enable.
        #
        # Pinned to v0.7.0 SPECIFICALLY because it requires Go >= 1.25.0, which is exactly
        # what go.mod declares and setup-go installs above. The newer v0.8.1 requires
        # Go >= 1.26 and would make `go install` silently download a second toolchain on
        # every run — slower, and it would analyse the code under a Go version the project
        # does not build with. Bump this together with go.mod, not ahead of it.
        #
        # -tags integration matches the golangci-lint run.build-tags setting: the
        # Postgres-backed tests open connections, create roles and assert privilege sets,
        # so they are the last files that should go unanalysed.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          staticcheck -tags integration ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    # The race detector instruments every memory access, so the suite runs several times
    # slower than the plain job above. Budgeted generously: a timeout kill reads as a red
    # build indistinguishable from a real finding.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Race-detector tests
        # A SEPARATE JOB from "Build, vet, and unit tests" on purpose. Sharing one job would
        # mean a data race and an ordinary assertion failure arrive as the same red X, and
        # whichever fails first hides the other. Keeping them apart means the check name
        # alone says which kind of defect was found — and a race, which is timing-dependent
        # and may not reproduce, is never masked by a functional failure that will.
        #
        # This matters more here than in most services: the engine's whole concurrency story
        # is pessimistic locking around wallet mutation, and a race in that path corrupts
        # balances rather than crashing.
        #
        # -count=1 for the same reason as the unit-test job: a cached PASS from an earlier
        # commit would make this gate report green without instrumenting anything.
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests with coverage
        # Its own job rather than an extra step on "Build, vet, and unit tests", for the
        # same reason the race detector is separate: a coverage shortfall and a failing
        # assertion are different problems, and a shared job would report them as one red
        # X where the first failure hides the second. The cost is one more run of a
        # ~30-second suite.
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce coverage floors
        # The script prints EVERY package with its percentage and names precisely which
        # one tripped, so a failure is actionable from the check output alone without
        # re-running anything locally.
        run: ./scripts/check-coverage.sh coverage.out

      - name: Upload coverage profile
        # Kept even when the gate fails — that is exactly when someone wants to open the
        # profile and see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 7

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The patch level matters here in a way it does not for the other jobs:
          # govulncheck reports standard-library vulnerabilities against the Go version
          # that BUILDS the code, so the go.mod directive is itself part of this gate.
          # It is pinned at 1.25.13 because that is the highest patch release required by
          # any stdlib advisory this module was exposed to.
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Pinned like the other tools: an unpinned scanner turns a new release into a red
        # build on a change that touched nothing. The VULNERABILITY DATABASE is still
        # fetched fresh on every run, so pinning the binary does not freeze the findings —
        # a newly disclosed CVE will fail this job tomorrow without any change here.
        #
        # govulncheck exits non-zero only for vulnerabilities your code can actually REACH.
        # Advisories in required modules whose vulnerable symbols are never called are
        # reported but do not fail the build, which is what keeps this gate meaningful
        # rather than a standing wall of noise nobody reads.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Pinned to the major version the engine targets (ARCHITECTURE.md: PostgreSQL v15+).
        # Testing the ledger's privilege and trigger behaviour against a DIFFERENT major
        # than production would prove the wrong thing: grants, partitioned-table triggers
        # and SECURITY DEFINER semantics are exactly the areas where majors differ.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: engine_test
        ports:
          - 5432:5432
        # Without a health check the test step starts while Postgres is still initialising
        # and fails on connection refused — a red build that says nothing about the code.
        options: >-
          --health-cmd "pg_isready -U postgres -d engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1 rather than localhost: the service port is published on the runner's
      # IPv4 loopback, and "localhost" can resolve to ::1 first and refuse the connection.
      #
      # These connections are deliberately the SUPERUSER. The grant tests need it: they
      # create the engine_writer role, provision a throwaway login user, and assert what
      # that restricted user cannot do. A least-privilege URL here would make the tests
      # skip or error rather than prove anything.
      #
      # ONE DATABASE PER SUITE — see "Provision an isolated database per suite" below.
      ENGINE_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/engine_test?sslmode=disable
      REPO_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/repo_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ────────────────────────────────────────────────────────────────────────
      # THE TWO SUITES MUST NOT SHARE A DATABASE.
      #
      # cmd/engine's grant tests deliberately insert a single UNBALANCED ledger row
      # (an IT_OP DEBIT) to prove that UPDATE and DELETE are refused — and because the
      # ledger is append-only by design, that row can never be removed again.
      #
      # internal/repository's assertDoubleEntryBalanced scans ledger_entries TABLE-WIDE.
      # That is the strict form of the invariant and the one worth keeping, so the fix is
      # to isolate the data rather than to narrow the assertion: sharing one database
      # makes the probe row look like a real accounting breach and fails four settlement
      # tests that are behaving correctly.
      # ────────────────────────────────────────────────────────────────────────
      - name: Provision an isolated database per suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE repo_test;'

      # The settlement tests need the schema but do not build it themselves; the migrator
      # is the only thing that may create it, so it runs against the repository database
      # exactly as it does against the engine one.
      - name: Apply migrations to the repository suite's database
        env:
          TEST_POSTGRES_URL: ${{ env.REPO_DB_URL }}
        run: go test -count=1 -tags integration ./cmd/engine/ -run TestRunMigrations_Integration

      - name: Integration tests — cmd/engine (migrations, grants, append-only)
        env:
          TEST_POSTGRES_URL: ${{ env.ENGINE_DB_URL }}
        run: |
          set -o pipefail
          go test -count=1 -tags integration -v ./cmd/engine/ 2>&1 | tee engine.log

      - name: Integration tests — internal/repository (settlement, double-entry)
        env:
          TEST_POSTGRES_URL: ${{ env.REPO_DB_URL }}
        run: |
          set -o pipefail
          go test -count=1 -tags integration -v ./internal/repository/ 2>&1 | tee repo.log

      # ────────────────────────────────────────────────────────────────────────
      # THE POINT OF THIS STEP. Every Postgres-backed test begins with
      #   if url == "" { t.Skip("TEST_POSTGRES_URL not set") }
      # so a mis-plumbed environment variable does not fail the job — it makes the tests
      # vanish and the job report green while proving nothing. That is the precise shape
      # of the defect Milestone 0 kept finding: a control that looks enforced and is not.
      #
      # internal/repository is the proof that this guard is not theoretical. Those five
      # tests carried no build tag and no CI coverage, and skipped silently for their
      # entire existence — nobody had ever seen them run.
      #
      # if: always() so the guard reports even when a suite fails; a skip must never be
      # able to hide behind an unrelated red step.
      # ────────────────────────────────────────────────────────────────────────
      - name: Assert the ledger invariants were actually exercised
        if: always()
        run: |
          fail=0

          check() {
            local name="$1" log="$2" pattern="$3" want="$4"

            if [ ! -f "$log" ]; then
              echo "::error::${name}: ${log} is missing — the suite never ran."
              fail=1
              return
            fi

            local skipped passed
            skipped=$(grep -cE '^--- SKIP' "$log" || true)
            passed=$(grep -cE "^--- PASS: (${pattern})" "$log" || true)

            echo "${name}: ${passed} Postgres-backed test(s) passed, ${skipped} skipped"

            if [ "$skipped" -ne 0 ]; then
              echo "::error::${name}: ${skipped} test(s) SKIPPED — TEST_POSTGRES_URL is not reaching them."
              grep -E '^--- SKIP' "$log"
              fail=1
            fi

            if [ "$passed" -lt "$want" ]; then
              echo "::error::${name}: only ${passed} of the expected ${want} Postgres-backed tests passed."
              echo "Either the build tag, the -run filter, or the database wiring is wrong."
              fail=1
            fi
          }

          # cmd/engine: 5x TestLedgerGrants_*, the boot guard, and the migration runner.
          check "cmd/engine" engine.log \
            'TestLedgerGrants|TestAssertLedgerAppendOnly|TestRunMigrations_Integration' 7

          # internal/repository: the 5 settlement tests, including both concurrency proofs.
          check "internal/repository" repo.log 'TestIntegration_' 5

          exit "$fail"
