# Dev/demo stack for the True Engine. NOT a production deployment: secrets
# are inline defaults here for one-command bring-up; override them via a
# .env file (gitignored) or your orchestrator's secret store.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-true_engine}
      POSTGRES_USER: ${POSTGRES_USER:-casino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casino-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casino} -d ${POSTGRES_DB:-true_engine}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL install on 5432.
      - "5433:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  engine:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      PORT: "8080"
      POSTGRES_URL: postgres://${POSTGRES_USER:-casino}:${POSTGRES_PASSWORD:-casino-dev-password}@postgres:5432/${POSTGRES_DB:-true_engine}?sslmode=disable
      # DEV ONLY. The dev stack connects as the database OWNER, for which the
      # engine_writer grants are inert (an owner holds implicit full rights), so
      # the boot check in cmd/engine would refuse to start. The append-only
      # invariant is still enforced here by the 000008 triggers, which fire for
      # every role including the owner.
      #
      # PRODUCTION MUST NOT SET THIS. Instead provision a login user that is a
      # member of engine_writer and point POSTGRES_URL at it, keeping the
      # privileged credential in MIGRATION_POSTGRES_URL for schema changes only:
      #   MIGRATION_POSTGRES_URL: postgres://<owner>:<secret>@postgres:5432/<db>
      LEDGER_ROLE_CHECK: ${LEDGER_ROLE_CHECK:-disabled}
      REDIS_URL: redis://redis:6379/0
      # operator_code:hmac_secret pairs — dev values only.
      OPERATOR_SECRETS: ${OPERATOR_SECRETS:-PRAGMATIC:dev-secret-pragmatic,HACKSAW:dev-secret-hacksaw}
      ADMIN_PORT: "9090"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      RATE_LIMIT_RPS: "5000"
      # Absolute ceiling on a single THIRD-PARTY win credit. Required — the
      # engine cannot re-derive an external provider's payout, so this is the
      # backstop against a leaked webhook secret minting redeemable currency.
      # First-party /spin rounds are bounded by the paytable instead.
      MAX_PROVIDER_WIN: ${MAX_PROVIDER_WIN:-50000.0000}
      # ── Jurisdiction enforcement ────────────────────────────────────────────
      # FAIL CLOSED: any request whose region cannot be positively established
      # is rejected with 403. Running without enforcement now requires the
      # EXPLICIT opt-out below — an absent GEOIP_DB_PATH is a boot error, not a
      # silent disable (which is how the blocklist previously looked
      # configured while enforcing nothing).
      #
      # This dev stack ships with enforcement OFF because there is no GeoLite2
      # file in the image. Mount one and drop GEOFENCE_MODE for a realistic run.
      GEOFENCE_MODE: ${GEOFENCE_MODE:-disabled}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-}
      # Blocked US states. Empty falls back to the code default (WA, ID, TN, WY).
      # Review with counsel before launch — this list is a default, not advice.
      BLOCKED_REGIONS: ${BLOCKED_REGIONS:-}
      # CIDRs whose X-Forwarded-For is honoured. EMPTY = the header is ignored
      # and the socket peer is the client. Set this to your load balancer's
      # range in any environment that fronts the engine with a proxy —
      # otherwise real player IPs never reach the fence.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080" # operator API
      - "9090:9090" # admin API
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC

volumes:
  postgres-data:
