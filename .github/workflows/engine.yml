# Zone 1 (True Engine) continuous integration — M1.1-T1 SKELETON.
#
# Scope is deliberately narrow: compile, vet, and run the unit tests, on a pinned toolchain.
# This is the floor every later gate builds on, and it must be RELIABLY GREEN — a pipeline
# that is red for reasons unrelated to the change under review teaches people to ignore it,
# which is worse than having no pipeline.
#
# The file-size guard (M0-T2) stays in its own workflow: it scans the tracked tree on a
# different trigger scope and has nothing to do with the Go toolchain.
#
# Redis is deliberately NOT provisioned: every test uses miniredis in-process, so a Redis
# service container would be unused infrastructure standing in for a guarantee nothing checks.
name: Engine CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: this workflow only ever reads the tree.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant. Cancelling it frees runners
# and stops a stale red/green result from landing after a newer one.
concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, vet, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than repeating it here. A hardcoded version
          # silently drifts from the module's own requirement, and then CI is validating a
          # toolchain nobody actually builds with.
          go-version-file: go.mod
          # Cache the module and build caches, keyed on go.sum.
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        # Confirms the downloaded dependencies match go.sum — a cheap integrity check that
        # catches a tampered or corrupted module cache before anything is compiled.
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        # -count=1 disables test-result caching. setup-go restores Go's build cache between
        # runs, and that cache can hold PASSING TEST RESULTS: without this flag a run can
        # report green from a previous commit's cached results rather than actually executing
        # the tests. For a money engine, a falsely-green CI run is the worst possible outcome.
        #
        # The integration-tagged tests are excluded here by default (they carry
        # `//go:build integration` and need a real Postgres); they get their own job in T6.
        run: go test -count=1 ./...

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned. An unpinned linter turns an upstream release into a surprise red build
          # on a change that touched nothing — the fastest way to teach a team to ignore CI.
          # Bump it deliberately, as its own reviewed change.
          version: v2.5.0
          args: --timeout=10m

      # `golangci-lint run` does NOT validate its own configuration: an unrecognised key is
      # ignored in silence and the run still reports "0 issues". That is how a lint rule can
      # appear to be enforced while doing nothing — the same class of defect Milestone 0 kept
      # finding. `config verify` fails the build on an invalid file.
      #
      # Not hypothetical: run.build-tags above was first written under a `build:` key that
      # does not exist. The linter accepted it, reported clean, and analysed none of the
      # integration files. Only injecting a deliberate compile error revealed it.
      #
      # This runs as a plain step rather than through the action, which can ONLY invoke
      # `golangci-lint run` — passing `config verify` as args makes it read them as target
      # directories and fail on "directory not found". The action puts the pinned binary on
      # PATH for later steps; the fallback covers it if that ever stops being true, so the
      # check can never be silently skipped.
      - name: Verify the golangci-lint configuration is valid
        run: |
          if ! command -v golangci-lint >/dev/null 2>&1; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          fi
          golangci-lint config verify

      - name: staticcheck
        # Run standalone as well as through golangci-lint. The two are not redundant: the
        # bundled copy tracks golangci-lint's release cadence and can lag upstream, and the
        # standalone tool applies check families the bundled linter does not enable.
        #
        # Pinned to v0.7.0 SPECIFICALLY because it requires Go >= 1.25.0, which is exactly
        # what go.mod declares and setup-go installs above. The newer v0.8.1 requires
        # Go >= 1.26 and would make `go install` silently download a second toolchain on
        # every run — slower, and it would analyse the code under a Go version the project
        # does not build with. Bump this together with go.mod, not ahead of it.
        #
        # -tags integration matches the golangci-lint run.build-tags setting: the
        # Postgres-backed tests open connections, create roles and assert privilege sets,
        # so they are the last files that should go unanalysed.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
          staticcheck -tags integration ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    # The race detector instruments every memory access, so the suite runs several times
    # slower than the plain job above. Budgeted generously: a timeout kill reads as a red
    # build indistinguishable from a real finding.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Race-detector tests
        # A SEPARATE JOB from "Build, vet, and unit tests" on purpose. Sharing one job would
        # mean a data race and an ordinary assertion failure arrive as the same red X, and
        # whichever fails first hides the other. Keeping them apart means the check name
        # alone says which kind of defect was found — and a race, which is timing-dependent
        # and may not reproduce, is never masked by a functional failure that will.
        #
        # This matters more here than in most services: the engine's whole concurrency story
        # is pessimistic locking around wallet mutation, and a race in that path corrupts
        # balances rather than crashing.
        #
        # -count=1 for the same reason as the unit-test job: a cached PASS from an earlier
        # commit would make this gate report green without instrumenting anything.
        run: go test -race -count=1 ./...

  coverage:
    name: Coverage floors
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests with coverage
        # Its own job rather than an extra step on "Build, vet, and unit tests", for the
        # same reason the race detector is separate: a coverage shortfall and a failing
        # assertion are different problems, and a shared job would report them as one red
        # X where the first failure hides the second. The cost is one more run of a
        # ~30-second suite.
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Enforce coverage floors
        # The script prints EVERY package with its percentage and names precisely which
        # one tripped, so a failure is actionable from the check output alone without
        # re-running anything locally.
        run: ./scripts/check-coverage.sh coverage.out

      - name: Upload coverage profile
        # Kept even when the gate fails — that is exactly when someone wants to open the
        # profile and see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 7

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The patch level matters here in a way it does not for the other jobs:
          # govulncheck reports standard-library vulnerabilities against the Go version
          # that BUILDS the code, so the go.mod directive is itself part of this gate.
          # It is pinned at 1.25.13 because that is the highest patch release required by
          # any stdlib advisory this module was exposed to.
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # Pinned like the other tools: an unpinned scanner turns a new release into a red
        # build on a change that touched nothing. The VULNERABILITY DATABASE is still
        # fetched fresh on every run, so pinning the binary does not freeze the findings —
        # a newly disclosed CVE will fail this job tomorrow without any change here.
        #
        # govulncheck exits non-zero only for vulnerabilities your code can actually REACH.
        # Advisories in required modules whose vulnerable symbols are never called are
        # reported but do not fail the build, which is what keeps this gate meaningful
        # rather than a standing wall of noise nobody reads.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Pinned to the major version the engine targets (ARCHITECTURE.md: PostgreSQL v15+).
        # Testing the ledger's privilege and trigger behaviour against a DIFFERENT major
        # than production would prove the wrong thing: grants, partitioned-table triggers
        # and SECURITY DEFINER semantics are exactly the areas where majors differ.
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          # No password. The container is throwaway: it lives only for this job, listens
          # only on the runner's loopback, and is destroyed with the job — so a password
          # here protects nothing, while a credential-shaped literal in a tracked file
          # trains the secret scanner to cry wolf. Trust auth removes the string entirely
          # rather than suppressing the finding.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: engine_test
        ports:
          - 5432:5432
        # Without a health check the test step starts while Postgres is still initialising
        # and fails on connection refused — a red build that says nothing about the code.
        options: >-
          --health-cmd "pg_isready -U postgres -d engine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1 rather than localhost: the service port is published on the runner's
      # IPv4 loopback, and "localhost" can resolve to ::1 first and refuse the connection.
      #
      # These connections are deliberately the SUPERUSER. The grant tests need it: they
      # create the engine_writer role, provision a throwaway login user, and assert what
      # that restricted user cannot do. A least-privilege URL here would make the tests
      # skip or error rather than prove anything.
      #
      # ONE DATABASE PER SUITE — see "Provision an isolated database per suite" below.
      ENGINE_DB_URL: postgres://postgres@127.0.0.1:5432/engine_test?sslmode=disable
      REPO_DB_URL: postgres://postgres@127.0.0.1:5432/repo_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ────────────────────────────────────────────────────────────────────────
      # THE TWO SUITES MUST NOT SHARE A DATABASE.
      #
      # cmd/engine's grant tests deliberately insert a single UNBALANCED ledger row
      # (an IT_OP DEBIT) to prove that UPDATE and DELETE are refused — and because the
      # ledger is append-only by design, that row can never be removed again.
      #
      # internal/repository's assertDoubleEntryBalanced scans ledger_entries TABLE-WIDE.
      # That is the strict form of the invariant and the one worth keeping, so the fix is
      # to isolate the data rather than to narrow the assertion: sharing one database
      # makes the probe row look like a real accounting breach and fails four settlement
      # tests that are behaving correctly.
      # ────────────────────────────────────────────────────────────────────────
      - name: Provision an isolated database per suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE repo_test;'

      # The settlement tests need the schema but do not build it themselves; the migrator
      # is the only thing that may create it, so it runs against the repository database
      # exactly as it does against the engine one.
      - name: Apply migrations to the repository suite's database
        env:
          TEST_POSTGRES_URL: ${{ env.REPO_DB_URL }}
        run: go test -count=1 -tags integration ./cmd/engine/ -run TestRunMigrations_Integration

      - name: Integration tests — cmd/engine (migrations, grants, append-only)
        env:
          TEST_POSTGRES_URL: ${{ env.ENGINE_DB_URL }}
        run: |
          set -o pipefail
          go test -count=1 -tags integration -v ./cmd/engine/ 2>&1 | tee engine.log

      - name: Integration tests — internal/repository (settlement, double-entry)
        env:
          TEST_POSTGRES_URL: ${{ env.REPO_DB_URL }}
        run: |
          set -o pipefail
          go test -count=1 -tags integration -v ./internal/repository/ 2>&1 | tee repo.log

      # ────────────────────────────────────────────────────────────────────────
      # THE POINT OF THIS STEP. Every Postgres-backed test begins with
      #   if url == "" { t.Skip("TEST_POSTGRES_URL not set") }
      # so a mis-plumbed environment variable does not fail the job — it makes the tests
      # vanish and the job report green while proving nothing. That is the precise shape
      # of the defect Milestone 0 kept finding: a control that looks enforced and is not.
      #
      # internal/repository is the proof that this guard is not theoretical. Those five
      # tests carried no build tag and no CI coverage, and skipped silently for their
      # entire existence — nobody had ever seen them run.
      #
      # if: always() so the guard reports even when a suite fails; a skip must never be
      # able to hide behind an unrelated red step.
      # ────────────────────────────────────────────────────────────────────────
      - name: Assert the ledger invariants were actually exercised
        if: always()
        run: |
          fail=0

          check() {
            local name="$1" log="$2" pattern="$3" want="$4"

            if [ ! -f "$log" ]; then
              echo "::error::${name}: ${log} is missing — the suite never ran."
              fail=1
              return
            fi

            local skipped passed
            skipped=$(grep -cE '^--- SKIP' "$log" || true)
            passed=$(grep -cE "^--- PASS: (${pattern})" "$log" || true)

            echo "${name}: ${passed} Postgres-backed test(s) passed, ${skipped} skipped"

            if [ "$skipped" -ne 0 ]; then
              echo "::error::${name}: ${skipped} test(s) SKIPPED — TEST_POSTGRES_URL is not reaching them."
              grep -E '^--- SKIP' "$log"
              fail=1
            fi

            if [ "$passed" -lt "$want" ]; then
              echo "::error::${name}: only ${passed} of the expected ${want} Postgres-backed tests passed."
              echo "Either the build tag, the -run filter, or the database wiring is wrong."
              fail=1
            fi
          }

          # cmd/engine: 5x TestLedgerGrants_*, the boot guard, and the migration runner.
          check "cmd/engine" engine.log \
            'TestLedgerGrants|TestAssertLedgerAppendOnly|TestRunMigrations_Integration' 7

          # internal/repository: the 5 settlement tests, including both concurrency proofs.
          check "internal/repository" repo.log 'TestIntegration_' 5

          exit "$fail"

  rtp:
    name: RTP convergence (Gate A)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 5,000,000 spins on every pull request. The gate's tolerance is derived
      # from this number — 4σ/√n — so raising it tightens the check automatically:
      # 5e6 gives a band of ~0.98pp, where the nightly 1e8 gives ~0.22pp.
      RTP_SPINS: "5000000"
      RTP_REPORT_PATH: ${{ github.workspace }}/rtp-report.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ────────────────────────────────────────────────────────────────────────
      # THE GATE ITSELF.
      #
      # Runs the production Spin path — crypto/rand, the weighted strip walk, the
      # evaluator — 5,000,000 times and compares the realised return against
      # Paytable.TheoreticalRTP(). The exhaustive test proves the evaluator and
      # the closed-form RTP agree; it never draws anything, so it cannot see the
      # RNG. This is the check that can.
      #
      # Failure is two-sided: an engine paying too much and an engine paying too
      # little are both defects, one financial and one regulatory.
      # ────────────────────────────────────────────────────────────────────────
      - name: Monte-Carlo RTP convergence
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/game/ \
            -run 'TestMonteCarloRTPConvergence|TestTheoreticalVarianceMatchesExhaustive|TestRTPGateIsTwoSided|TestRTPToleranceScalesWithSampleSize|TestRTPGateRejectsInvalidSampleSize|TestExhaustiveReturnMatchesTheory' \
            2>&1 | tee rtp.log

      # ────────────────────────────────────────────────────────────────────────
      # The gate is only worth having if it actually ran, at the size it claims,
      # and reached a verdict. Three separate ways that could silently fail:
      #   - the test skips (see the -short step below)
      #   - the -run filter stops matching after a rename, so nothing executes
      #   - RTP_SPINS is mistyped and the gate quietly runs its 1e6 default
      # The report is the evidence for all three, so it is checked rather than
      # trusted. This is the same reasoning as the integration job's skip-guard.
      # ────────────────────────────────────────────────────────────────────────
      - name: Assert the gate ran at full size and reached a verdict
        if: always()
        run: |
          if [ ! -f "$RTP_REPORT_PATH" ]; then
            echo "::error::rtp-report.json was not produced — the gate never ran."
            exit 1
          fi

          skipped=$(grep -cE '^--- SKIP' rtp.log || true)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::${skipped} RTP test(s) SKIPPED; none may be."
            grep -E '^--- SKIP' rtp.log
            exit 1
          fi

          python3 - "$RTP_REPORT_PATH" "$RTP_SPINS" <<'PY'
          import json, sys
          report_path, want_spins = sys.argv[1], int(sys.argv[2])
          r = json.load(open(report_path))

          print(f"spins            {r['spins']}")
          print(f"theoretical rtp  {r['theoretical_rtp']}")
          print(f"empirical rtp    {r['empirical_rtp']}")
          print(f"delta            {r['delta']}  (z = {r['z_score']})")
          print(f"tolerance        {r['tolerance']}  ({r['sigma_multiplier']}σ)")
          print(f"within tolerance {r['within_tolerance']}")

          failed = False
          if r["spins"] != want_spins:
              print(f"::error::report says {r['spins']} spins, expected {want_spins} — "
                    "RTP_SPINS is not reaching the test.")
              failed = True
          if not r["within_tolerance"]:
              print("::error::RTP drifted outside the derived band; see the delta above.")
              failed = True
          if r["sigma_multiplier"] != 4:
              print(f"::error::sigma multiplier is {r['sigma_multiplier']}, expected 4.")
              failed = True
          # A tolerance that is not a positive number means the band was never
          # derived, and a gate with no band passes everything.
          if not float(r["tolerance"]) > 0:
              print(f"::error::tolerance {r['tolerance']} is not positive.")
              failed = True
          sys.exit(1 if failed else 0)
          PY

      # ────────────────────────────────────────────────────────────────────────
      # Requirement: this gate must never be -short-skippable.
      #
      # Asserted behaviourally rather than by reading the source. The test it
      # replaced opened with `if testing.Short() { t.Skip(...) }`, so the one
      # check that exercises the RNG against the payout model vanished under a
      # flag while the job still reported green. Run it WITH -short — at a small
      # sample size, since only the skip behaviour is under test here — and fail
      # if anything skips.
      # ────────────────────────────────────────────────────────────────────────
      - name: Prove the gate cannot be skipped with -short
        env:
          RTP_SPINS: "50000"
          RTP_REPORT_PATH: ${{ runner.temp }}/rtp-short-probe.json
        run: |
          set -o pipefail
          go test -short -count=1 -v ./internal/game/ -run TestMonteCarloRTPConvergence 2>&1 | tee rtp-short.log

          if grep -qE '^--- SKIP' rtp-short.log; then
            echo "::error::the RTP gate skipped under -short; it must not be skippable."
            grep -E '^--- SKIP' rtp-short.log
            exit 1
          fi
          if ! grep -qE '^--- PASS: TestMonteCarloRTPConvergence' rtp-short.log; then
            echo "::error::the RTP gate did not run under -short."
            exit 1
          fi
          echo "confirmed: the gate runs under -short and does not skip"

      - name: Upload rtp-report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtp-report-pr
          path: ${{ env.RTP_REPORT_PATH }}
          retention-days: 30
          if-no-files-found: error

  identity:
    name: GC/SC identity (Gate B)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # 10,000,000 spins PER CURRENCY. The cross-check compares two independent
      # means, so its band carries √(2/n) — at this sample size that is ~0.98pp,
      # the same width as Gate A's single-sample band at 5,000,000.
      CURRENCY_SPINS: "10000000"
      CURRENCY_REPORT_PATH: ${{ github.workspace }}/currency-identity-report.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ────────────────────────────────────────────────────────────────────────
      # STRUCTURAL ENFORCEMENT, first and separately.
      #
      # If the outcome layer can see a currency, every downstream number is
      # suspect and the identity result below means nothing. `go build` already
      # fails on a currency parameter (the compile-time pins in
      # internal/game/currency_agnostic.go), so reaching this step at all proves
      # the signatures held; these tests close the routes around them — an
      # import of internal/domain, or a NEW exported function taking a currency.
      # ────────────────────────────────────────────────────────────────────────
      - name: Structural enforcement (currency-blind outcome layer)
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/game/ \
            -run 'TestGamePackageIsCurrencyBlind|TestExportedSignaturesCarryNoCurrency|TestPaytableHashIsStableAndDiscriminating|TestRegisteredGamesIsIsolated' \
            2>&1 | tee identity-structure.log

      - name: Identity and divergence isolation
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/repository/ \
            -run 'TestCurrencyModelIdentity|TestCurrencyDivergenceIsOnlyWalletAndLedger|TestSeededEntropyIsDeterministicAndVaried|TestCrossCheckBandScalesWithSampleSize' \
            2>&1 | tee identity.log

      - name: Statistical cross-check (10,000,000 spins per currency)
        run: |
          set -o pipefail
          go test -count=1 -timeout 25m -v ./internal/repository/ \
            -run TestCurrencyRTPCrossCheck 2>&1 | tee identity-crosscheck.log

      # Same reasoning as Gate A's guard: the report is the evidence, so it is
      # checked rather than the exit code trusted. A cross-check that quietly ran
      # its 250,000-spin default would report green against a band six times
      # wider than the one this job exists to apply.
      - name: Assert the gate ran at full size and reached a verdict
        if: always()
        run: |
          fail=0
          for log in identity-structure.log identity.log identity-crosscheck.log; do
            if [ ! -f "$log" ]; then
              echo "::error::${log} is missing — that step never ran."
              fail=1
              continue
            fi
            skipped=$(grep -cE '^--- SKIP' "$log" || true)
            if [ "$skipped" -ne 0 ]; then
              echo "::error::${log}: ${skipped} test(s) SKIPPED; none may be."
              grep -E '^--- SKIP' "$log"
              fail=1
            fi
          done

          if [ ! -f "$CURRENCY_REPORT_PATH" ]; then
            echo "::error::currency-identity-report.json was not produced."
            exit 1
          fi

          python3 - "$CURRENCY_REPORT_PATH" "$CURRENCY_SPINS" <<'PY'
          import json, sys
          report_path, want_spins = sys.argv[1], int(sys.argv[2])
          r = json.load(open(report_path))

          print(f"game             {r['game_id']} v{r['paytable_version']}")
          print(f"paytable hash    {r['paytable_hash']}")
          print(f"spins/currency   {r['spins_per_currency']}")
          print(f"theoretical rtp  {r['theoretical_rtp']}")
          print(f"GC empirical     {r['gc_empirical_rtp']}")
          print(f"SC empirical     {r['sc_empirical_rtp']}")
          print(f"difference       {r['difference']}  (z = {r['z_score']})")
          print(f"tolerance        {r['tolerance']}  ({r['sigma_multiplier']}σ)")
          print(f"within tolerance {r['within_tolerance']}")

          failed = False
          if r["spins_per_currency"] != want_spins:
              print(f"::error::report says {r['spins_per_currency']} spins per currency, "
                    f"expected {want_spins} — CURRENCY_SPINS is not reaching the test.")
              failed = True
          if not r["within_tolerance"]:
              print("::error::GC and SC returns diverge beyond analytic noise.")
              failed = True
          if not float(r["tolerance"]) > 0:
              print(f"::error::tolerance {r['tolerance']} is not positive.")
              failed = True
          sys.exit(1 if failed else 0)
          PY

          exit "$fail"

      - name: Upload currency-identity-report.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: currency-identity-report
